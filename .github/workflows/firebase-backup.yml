name: Firebase Database Backup

on:
  # Run daily at 2:00 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Create backup directory
        run: mkdir -p backups
      
      - name: Authenticate with Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_TOKEN" > $HOME/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
      
      - name: Export Firebase Database
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d-%H-%M-%S")
          BACKUP_FILE="backups/database-backup-${TIMESTAMP}.json"
          
          echo "Creating backup: $BACKUP_FILE"
          firebase database:get / --project la-perla-53540395-70c43 --output "$BACKUP_FILE"
          
          echo "Backup created successfully!"
          ls -lh "$BACKUP_FILE"
      
      - name: Upload backup as artifact
        uses: actions/upload-artifact@v3
        with:
          name: firebase-backup
          path: backups/*.json
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          rm -f $HOME/firebase-service-account.json
