
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light">
    <title>La Perla Nail AI Stylist</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" href="#F8F6F2">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="La Perla">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light; }
      body { overscroll-behavior-y: contain; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
      
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in { animation: fade-in 0.3s ease-in-out; }

      /* --- MARQUEE ANIMATION (SỬA LẠI ĐỂ LẶP VÔ TẬN MƯỢT MÀ) --- */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        display: inline-block;
        white-space: nowrap;
        /* THAY ĐỔI TỐC ĐỘ TẠI ĐÂY: 25s là trung bình, 15s là nhanh, 45s là chậm */
        animation: marquee 25s linear infinite;
        will-change: transform;
      }
      
      @media print {
          @page { margin: 0; size: auto; }
          body, html, #root { margin: 0; padding: 0; background-color: white !important; height: auto !important; min-height: 0 !important; overflow: visible !important; }
          .print\:hidden { display: none !important; }
          .printable-area { display: block !important; visibility: visible !important; position: static !important; width: 100% !important; height: auto !important; min-height: 0 !important; padding: 4mm !important; margin: 0 !important; background-color: white !important; color: black !important; box-sizing: border-box !important; font-family: 'Poppins', sans-serif !important; font-size: 12px !important; line-height: 1.2 !important; }
          .printable-area * { visibility: visible !important; color: black !important; background-color: transparent !important; background-image: none !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 'serif': ['"Playfair Display"', 'serif'], 'sans': ['"Poppins"', 'sans-serif'], },
            colors: { 'pearl-white': '#F8F6F2', 'blush-pink': '#F5E0E5', 'dusty-rose': '#D8B6C1', 'gold-leaf': '#D4AF37', 'charcoal': '#333333', }
          }
        }
      }
    </script>
